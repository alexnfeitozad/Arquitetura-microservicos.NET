name: Stock Management CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build
        run: dotnet build src/Stock.Management.sln -c Release
      - name: Test
        run: dotnet test tests/Stock.IntegrationTests/Stock.IntegrationTests.csproj -c Release
      - name: Docker Build & Push
        run: |
          docker build -t stock-api:latest src/Stock.API
          # docker push ...
